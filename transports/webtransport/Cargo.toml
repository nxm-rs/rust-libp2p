[package]
name = "libp2p-webtransport"
version = "0.1.0"
edition.workspace = true
rust-version = { workspace = true }
description = "Native WebTransport transport implementation for libp2p"
repository = "https://github.com/libp2p/rust-libp2p"
license = "MIT"
readme = "README.md"

[dependencies]
futures = { workspace = true }
futures-timer = { workspace = true }
if-watch = { workspace = true, features = ["tokio"] }
libp2p-core = { workspace = true }
libp2p-identity = { workspace = true, features = ["ed25519", "rand"] }
libp2p-noise = { workspace = true }
libp2p-tls = { workspace = true }
quinn = { version = "0.11.9", default-features = false, features = ["rustls", "futures-io", "runtime-tokio"] }
rcgen = { workspace = true }
rustls = { version = "0.23.40", default-features = false }
sha2 = "0.10.8"
socket2 = "0.6.4"
thiserror = { workspace = true }
time = { version = "0.3.36", default-features = false }
tokio = { workspace = true, default-features = false, features = ["net", "rt", "time"] }
tracing = { workspace = true }
wtransport = { version = "0.7.1", default-features = false, features = ["quinn", "ring"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
libp2p-identity = { workspace = true, features = ["rand"] }
time = { version = "0.3.36", features = ["macros"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
