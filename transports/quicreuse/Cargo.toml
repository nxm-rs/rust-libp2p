[package]
name = "libp2p-quicreuse"
version = "0.1.0"
edition.workspace = true
rust-version = { workspace = true }
description = "Shared QUIC endpoint with ALPN-routed connection acceptance for libp2p"
repository = "https://github.com/libp2p/rust-libp2p"
license = "MIT"

[dependencies]
futures = { workspace = true }
quinn = { version = "0.11.9", default-features = false, features = ["rustls", "runtime-tokio"] }
thiserror = { workspace = true }
tokio = { workspace = true, default-features = false, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
libp2p-identity = { workspace = true, features = ["ed25519", "rand"] }
libp2p-tls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
